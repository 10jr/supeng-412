功能名称: 任务一 · 事件侦探——触摸事件探针与记录页面

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务一 · 事件侦探 · 苏鹏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 20px 16px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    color: #e94560;
    margin-bottom: 6px;
  }
  .SP_subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }

  /* 探针区域 */
  #SP_pad {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #16213e, #0f3460);
    border-radius: 12px;
    border: 2px dashed #e94560;
    touch-action: none;
    user-select: none;
    -webkit-touch-callout: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  #SP_pad:active { transform: scale(0.98); }
  .SP_pad-hint { text-align: center; line-height: 1.6; }

  /* 日志区 */
  .SP_log-box {
    background: #0d0d1a;
    border-radius: 8px;
    padding: 14px;
    max-height: 260px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    border: 1px solid #333;
    margin-bottom: 16px;
  }
  .SP_log-entry { padding: 2px 0; }
  .SP_log-touchstart { color: #4ade80; }
  .SP_log-touchmove  { color: #60a5fa; }
  .SP_log-touchend   { color: #f59e0b; }
  .SP_log-click      { color: #e94560; }
  .SP_log-cancel     { color: #ef4444; }
  .SP_coord { color: #94a3b8; font-size: 11px; }

  /* 控制按钮 */
  .SP_controls { display: flex; gap: 10px; margin-bottom: 16px; }
  .SP_btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .SP_btn-clear { background: #333; color: #ccc; }
  .SP_btn-clear:hover { background: #444; }
  .SP_btn-save  { background: #e94560; color: #fff; }
  .SP_btn-save:hover  { background: #d63851; }

  /* 事件次数统计 */
  .SP_stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .SP_stat-card {
    background: #16213e;
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }
  .SP_stat-num { font-size: 22px; font-weight: bold; color: #e94560; }
  .SP_stat-label { font-size: 11px; color: #888; margin-top: 2px; }

  /* 轨迹绘制区 */
  .SP_track-wrap {
    background: #0d0d1a;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #333;
    margin-bottom: 16px;
  }
  .SP_track-wrap h3 {
    font-size: 13px;
    color: #e94560;
    margin-bottom: 8px;
  }
  #SP_track-canvas {
    width: 100%;
    height: 120px;
    background: #1a1a2e;
    border-radius: 6px;
    touch-action: none;
  }
</style>
</head>
<body>

  <h1>🔍 事件侦探 · 触摸事件探针</h1>
  <p class="SP_subtitle">苏鹏 · 用手机按下、拖动、长按，观察事件触发顺序</p>

  <!-- 统计 -->
  <div class="SP_stats">
    <div class="SP_stat-card"><div class="SP_stat-num" id="SP_cnt-start">0</div><div class="SP_stat-label">touchstart</div></div>
    <div class="SP_stat-card"><div class="SP_stat-num" id="SP_cnt-move">0</div><div class="SP_stat-label">touchmove</div></div>
    <div class="SP_stat-card"><div class="SP_stat-num" id="SP_cnt-end">0</div><div class="SP_stat-label">touchend</div></div>
    <div class="SP_stat-card"><div class="SP_stat-num" id="SP_cnt-click">0</div><div class="SP_stat-label">click</div></div>
  </div>

  <!-- 探针 -->
  <div id="SP_pad">
    <div class="SP_pad-hint">👆 在这里按下、拖动、长按<br><span style="font-size:11px;">等待你的第一次触摸……</span></div>
  </div>

  <!-- 轨迹图 -->
  <div class="SP_track-wrap">
    <h3>📍 手指轨迹草图（实时绘制）</h3>
    <canvas id="SP_track-canvas"></canvas>
  </div>

  <!-- 日志 -->
  <div class="SP_log-box" id="SP_log">⏳ 等待触摸事件……</div>

  <div class="SP_controls">
    <button class="SP_btn SP_btn-clear" id="SP_btn-clear">清空日志</button>
    <button class="SP_btn SP_btn-save"  id="SP_btn-save">保存日志</button>
  </div>

<script>
  /* 作者: 苏鹏 | 功能: 触摸事件探针，记录顺序、坐标、次数 */

  const SP_pad   = document.getElementById('SP_pad');
  const SP_log   = document.getElementById('SP_log');
  const SP_canvas = document.getElementById('SP_track-canvas');
  const SP_ctx    = SP_canvas.getContext('2d');
  const SP_counts = { start:0, move:0, end:0, click:0 };
  const SP_trail  = [];   // 本次拖动的坐标轨迹

  // 苏鹏：初始化 canvas 尺寸
  function SP_initCanvas() {
    SP_canvas.width  = SP_canvas.clientWidth;
    SP_canvas.height = SP_canvas.clientHeight;
    SP_ctx.strokeStyle = '#e94560';
    SP_ctx.lineWidth   = 2;
    SP_ctx.lineCap     = 'round';
  }
  SP_initCanvas();
  window.addEventListener('resize', SP_initCanvas);

  // 苏鹏：往日志区追加一行
  function SP_log(msg, type) {
    const div = document.createElement('div');
    div.className = 'SP_log-entry SP_log-' + type;
    const t = new Date();
    const ts = `${t.getSeconds()}.${String(t.getMilliseconds()).padStart(3,'0')}`;
    div.textContent = `[${ts}] ${msg}`;
    if (SP_log.textContent === '⏳ 等待触摸事件……') SP_log.innerHTML = '';
    SP_log.appendChild(div);
    SP_log.scrollTop = SP_log.scrollHeight;
  }

  // 苏鹏：更新统计数字
  function SP_updateCount(key) {
    SP_counts[key]++;
    document.getElementById('SP_cnt-' + key).textContent = SP_counts[key];
  }

  // 苏鹏：在 canvas 上画轨迹点
  function SP_drawPoint(x, y, isLine) {
    const rect = SP_pad.getBoundingClientRect();
    const cx   = ((x - rect.left) / rect.width)  * SP_canvas.width;
    const cy   = ((y - rect.top)  / rect.height) * SP_canvas.height;
    if (isLine && SP_trail.length > 0) {
      const last = SP_trail[SP_trail.length - 1];
      SP_ctx.beginPath();
      SP_ctx.moveTo(last.x, last.y);
      SP_ctx.lineTo(cx, cy);
      SP_ctx.stroke();
    }
    SP_trail.push({ x: cx, y: cy });
  }

  // ==== 四个触摸事件 ====

  SP_pad.addEventListener('touchstart', function (SP_e) {
    SP_e.preventDefault();
    SP_updateCount('start');
    const t = SP_e.changedTouches[0];
    SP_log(`touchstart  → client(${t.clientX},${t.clientY})  手指数=${SP_e.touches.length}`, 'touchstart');
    SP_trail.length = 0;       // 新拖动，清空旧轨迹
    SP_ctx.clearRect(0, 0, SP_canvas.width, SP_canvas.height);
    SP_drawPoint(t.clientX, t.clientY, false);
  }, { passive: false });

  SP_pad.addEventListener('touchmove', function (SP_e) {
    SP_e.preventDefault();
    SP_updateCount('move');
    const t = SP_e.changedTouches[0];
    SP_drawPoint(t.clientX, t.clientY, true);
    // 每 10 次 move 才打一条日志，避免刷屏
    if (SP_counts.move % 10 === 0) {
      SP_log(`touchmove   → (${t.clientX},${t.clientY})  已触发 ${SP_counts.move} 次`, 'touchmove');
    }
  }, { passive: false });

  SP_pad.addEventListener('touchend', function (SP_e) {
    SP_e.preventDefault();
    SP_updateCount('end');
    const t = SP_e.changedTouches[0];
    SP_log(`touchend    → client(${t.clientX},${t.clientY})  changedTouches=${SP_e.changedTouches.length}`, 'touchend');
    SP_log(`本次拖动 touchmove 共触发约 ${SP_counts.move} 次（距离越长次数越多）`, 'touchmove');
  }, { passive: false });

  SP_pad.addEventListener('click', function () {
    SP_updateCount('click');
    SP_log(`click（touchend 之后系统补发）`, 'click');
  });

  SP_pad.addEventListener('touchcancel', function (SP_e) {
    SP_log(`touchcancel（被系统打断，如来电/手势返回）`, 'cancel');
  });

  // 苏鹏：清空按钮
  document.getElementById('SP_btn-clear').addEventListener('click', function () {
    SP_log.innerHTML = '⏳ 等待触摸事件……';
    for (let k in SP_counts) { SP_counts[k] = 0; document.getElementById('SP_cnt-' + k).textContent = 0; }
    SP_ctx.clearRect(0, 0, SP_canvas.width, SP_canvas.height);
    SP_trail.length = 0;
  });

  // 苏鹏：保存日志（复制到剪贴板）
  document.getElementById('SP_btn-save').addEventListener('click', function () {
    const text = SP_log.innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('✅ 日志已复制到剪贴板，可粘贴到任务一记录表');
    }).catch(() => {
      prompt('复制下面这段日志：', text);
    });
  });
</script>
</body>
</html>
