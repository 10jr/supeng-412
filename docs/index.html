<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>苏鹏 · 课堂作品集</title>
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --SP_c_paper: #F3F4F6;
  --SP_c_card: #FFFFFF;
  --SP_c_ink: #1C2430;
  --SP_c_muted: #75808F;
  --SP_c_line: #DCE1E8;
  --SP_c_violet: #4A2E8C;
  --SP_c_violet_soft: #EAE5F6;
}
body {
  background: var(--SP_c_paper);
  color: var(--SP_c_ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 40px;
}
.SP_card {
  width: 100%;
  max-width: 460px;
  background: var(--SP_c_card);
  border: 1px solid var(--SP_c_line);
  border-radius: 18px;
  padding: 26px 22px;
}
.SP_card h1 { font-size: 23px; margin-bottom: 6px; }
.SP_card h1 em { font-style: normal; color: var(--SP_c_violet); }
.SP_sub { font-size: 13px; color: var(--SP_c_muted); margin-bottom: 16px; }
.SP_id {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  padding: 10px 14px; margin-bottom: 18px;
  background: var(--SP_c_violet_soft);
  border-radius: 12px;
  font-size: 12px; font-weight: 600; color: var(--SP_c_violet);
}
.SP_entry {
  display: block;
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--SP_c_line);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
}
.SP_entry:active { transform: scale(.98); border-color: var(--SP_c_violet); }
.SP_entry strong { display: block; font-size: 15px; }
.SP_entry span { display: block; font-size: 12px; color: var(--SP_c_muted); }
.SP_go { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--SP_c_violet); }
.SP_foot { margin-top: 16px; text-align: center; font-size: 11px; color: var(--SP_c_muted); }
</style>
</head>
<body>
  <div class="SP_card">
    <h1>苏鹏 · 课堂<em>作品集</em></h1>
    <p class="SP_sub">高级网页设计 · 移动端触摸交互与榜单实战</p>

    <div class="SP_id">
      <span>姓名：苏鹏</span>
      <span>学号：24002120412</span>
      <span>班级：电子商务24004班</span>
    </div>

    <a class="SP_entry" href="mobile-events/index.html">
      <strong>📱 移动端触摸事件 · 四任务综合提交</strong>
      <span>事件探针 / 手势卡片 / 图片查看器 / 摇一摇</span>
      <span class="SP_go">打开页面 →</span>
    </a>

    <p class="SP_foot">GitHub Pages · 手机访问体验更完整</p>
  </div>
</body>
</html>
