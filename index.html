<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视剧榜单 - 苏鹏</title>
    <!-- 苏鹏：引入样式文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 苏鹏：榜单主容器 -->
    <div class="SP_container">
        <!-- 苏鹏：标题区域 -->
        <div class="SP_header">
            <h1 class="SP_title">热播影视剧排行榜</h1>
        </div>

        <!-- 苏鹏：Tab 切换区域 -->
        <ul class="SP_tabs" id="SP_tabs">
            <li class="SP_tab-item SP_active" data-type="daily">每日</li>
            <li class="SP_tab-item" data-type="weekly">每周</li>
            <li class="SP_tab-item" data-type="monthly">每月</li>
            <li class="SP_tab-item" data-type="all">全部</li>
        </ul>

        <!-- 苏鹏：榜单列表区域 -->
        <ol class="SP_rank-list" id="SP_rank-list">
            <!-- 列表项由 JS 动态渲染 -->
        </ol>
    </div>

    <!-- 苏鹏：引入脚本文件 -->
    <script src="js/main.js"></script>
</body>
</html>
